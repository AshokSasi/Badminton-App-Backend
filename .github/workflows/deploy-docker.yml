name: Deploy Docker to Personal Server

on:
  push:
    branches:
      - main  # Change to 'master' if that's your main branch
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server with Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to project directory
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Pull latest changes
            git pull origin main
            
            # Stop and remove existing containers
            docker-compose down
            
            # Rebuild and start containers
            docker-compose up -d --build
            
            # Clean up unused images
            docker image prune -f
            
            echo "✅ Docker deployment completed successfully!"

      - name: Wait for container to be healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Waiting for container to be healthy..."
            sleep 10
            
            # Check container status
            docker-compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.yml ps
            
            # Check container health
            if docker inspect --format='{{.State.Health.Status}}' badminton-backend 2>/dev/null | grep -q "healthy"; then
              echo "✅ Container is healthy!"
            else
              echo "⚠️  Container health check not available or container not healthy yet"
              docker logs badminton-backend --tail 20
            fi

      - name: Show container logs
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "📋 Container logs:"
            docker logs badminton-backend --tail 50
