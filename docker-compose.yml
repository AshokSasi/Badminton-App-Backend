version: '3.8'

services:
  badminton-backend:
    build: .
    container_name: badminton-backend
    ports:
      - "3000:3000"
    volumes:
      # Mount only the data directory to avoid overwriting code files
      - /home/ashok/badminton-database:/app/database/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
